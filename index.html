<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سایت من</title>
</head>
<body>
    <h1>سلام! خوش آمدید به سایت من</h1>
    <p>این صفحه با استفاده از گیت‌هاب ساخته شده است.</p>
</body>
</html>
<form>
    <label for="username">نام کاربری:</label>
    <input type="text" id="username" name="username" required>
    <br>
    <label for="password">رمز عبور:</label>
    <input type="password" id="password" name="password" required>
    <br>
    <button type="submit">ورود</button>
</form>
<div class="chat-container" style="max-width: 400px; margin: 20px auto; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; font-family: Tahoma, sans-serif;">
    <div class="chat-header" style="background: #007bff; color: white; padding: 10px; text-align: center;">گفتگو</div>
    <div class="chat-box" style="height: 300px; padding: 10px; overflow-y: scroll; background: #f9f9f9; display: flex; flex-direction: column; gap: 10px;">
        <div class="message incoming" style="background: #e2e2e2; padding: 8px 12px; border-radius: 8px; max-width: 70%; align-self: flex-start;">سلام! چطور می‌توانم کمکتان کنم؟</div>
    </div>
    <div class="chat-input" style="display: border-top: 1px solid #ccc; display: flex;">
        <input type="text" placeholder="پیام خود را بنویسید..." style="flex: 1; padding: 10px; border: none; outline: none;">
        <button type="button" style="background: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer;">ارسال</button>
    </div>
</div>
